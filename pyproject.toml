[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dps150ctl"
version = "0.1.0"
description = "FNIRSI DPS-150 CLI, live terminal dashboard and local device service"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "pyserial==3.5",
  "textual>=6,<9",
  "textual-plotext==1.0.1",
  "plotext>=5.2.8,<6",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
dps150ctl = "dps150ctl.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["dps150ctl*"]

[tool.setuptools.package-data]
dps150ctl = ["data/*.rules.in"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
